# New-API Docker Compose Configuration
#
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

version: '3.4' # For compatibility with older Docker versions

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-new-api}
#      - SQL_DSN=root:${MYSQL_PASSWORD}@tcp(mysql:3306)/new-api  # Point to the mysql service, uncomment if using MySQL
#      - LOG_SQL_DSN=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD}@postgres:5432/new-api-log # OPTIONAL: If you want a separate database for logging, uncomment and set this
#      - LOG_SQL_DSN=clickhouse://default:${CLICKHOUSE_PASSWORD}@clickhouse:9000/new_api_logs # OPTIONAL: Use ClickHouse for logs only; also uncomment clickhouse in depends_on and the clickhouse service below
#      - LOG_SQL_CLICKHOUSE_TTL_DAYS=0 # OPTIONAL: ClickHouse log retention days. Unset or 0 disables automatic deletion; set to e.g. 30 to keep 30 days
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - NODE_NAME=new-api-node-1
      # 异步任务(含统一生图 generate_image)超时兜底：超时后由清扫机制标记失败并退款。
      # 生图任务通常秒级完成，30 分钟足够覆盖重试/上游慢；默认 1440(24h)对生图过长。
      - TASK_TIMEOUT_MINUTES=30
      - SESSION_SECRET=${SESSION_SECRET}
      - CRYPTO_SECRET=${CRYPTO_SECRET}
      # Cloudflare R2 Storage
      - R2_ACCOUNT_ID=3b918f80852289d9879e7f73bccc2e22
      - R2_ACCESS_KEY_ID=4343befbc1949bcffabeefea95037224
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=api-o1key
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL:-https://assetcache.o1key.com}
      - R2_STORAGE_HOSTS=${R2_STORAGE_HOSTS:-api.o1key.cn,cf-api.o1key.com}
      # Local Storage (本地磁盘存储) - 当前不按请求域名自动选择
      - LOCAL_STORAGE_HOSTS=${LOCAL_STORAGE_HOSTS:-local-storage-disabled.invalid}
      # Aliyun OSS Storage
      - ALIYUN_OSS_ACCESS_KEY_ID=${ALIYUN_OSS_ACCESS_KEY_ID}
      - ALIYUN_OSS_ACCESS_KEY_SECRET=${ALIYUN_OSS_ACCESS_KEY_SECRET}
      - ALIYUN_OSS_BUCKET=${ALIYUN_OSS_BUCKET:-o1key}
      - ALIYUN_OSS_REGION=${ALIYUN_OSS_REGION:-cn-beijing}
      - ALIYUN_OSS_ENDPOINT=${ALIYUN_OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      - ALIYUN_OSS_PUBLIC_BASE_URL=${ALIYUN_OSS_PUBLIC_BASE_URL:-https://img.o1key.cn}
      - ALIYUN_OSS_STORAGE_HOSTS=${ALIYUN_OSS_STORAGE_HOSTS:-}
      # Kill-switch: when true, every upload that would target Aliyun OSS is redirected to R2
      - DISABLE_ALIYUN_OSS=${DISABLE_ALIYUN_OSS:-false}
      # Tencent VCLM (Kling -t models) post-paid markup over actual cost.
      # FinalUnitDeduction is RMB (1 credit = ¥1); 1.0 = sell at cost, 1.5 = +50%.
      - TENCENT_VIDEO_MARKUP=${TENCENT_VIDEO_MARKUP:-1.0}
#      - STREAMING_TIMEOUT=300
#      - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js
#      - SESSION_COOKIE_SECURE=true  # 启用 Secure session cookie，必须同时配置 SESSION_COOKIE_TRUSTED_URL (Enable Secure session cookies; requires SESSION_COOKIE_TRUSTED_URL)
#      - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com  # 可信 HTTPS 入口地址，多个用英文逗号分隔 (Trusted HTTPS entry URLs, comma-separated)

      # ========== 高并发优化配置（32G内存服务器）==========
      # 数据库连接池优化
      - SQL_MAX_IDLE_CONNS=200         # 默认100，提升空闲连接池
      - SQL_MAX_OPEN_CONNS=2000        # 默认1000，提升最大连接数
      - SQL_MAX_LIFETIME=120           # 默认60秒，延长连接生命周期
      # 缓存优化
      - MEMORY_CACHE_ENABLED=true      # 启用内存缓存，高并发核心优化
      - BATCH_UPDATE_ENABLED=true      # 启用批量更新，减少数据库写压力
      - BATCH_UPDATE_INTERVAL=3        # 默认5秒，改为3秒更及时
      - SYNC_FREQUENCY=30              # 默认60秒，改为30秒提升缓存一致性
      # Redis连接池优化
      - REDIS_POOL_SIZE=50             # 默认10，大幅提升Redis并发连接数
      # 中继HTTP连接池优化
      - RELAY_MAX_IDLE_CONNS=1000      # 默认500，提升中继空闲连接数
      - RELAY_MAX_IDLE_CONNS_PER_HOST=200  # 默认100，提升单主机并发连接

    depends_on:
      - redis
      - postgres
#      - mysql  # Uncomment if using MySQL
#      - clickhouse  # Uncomment if using ClickHouse for LOG_SQL_DSN
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "4gb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-new-api}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
#    ports:
#      - "5432:5432"  # 需要从外部访问时取消注释

#  clickhouse:
#    image: clickhouse/clickhouse-server:24.8
#    container_name: clickhouse
#    restart: always
#    environment:
#      CLICKHOUSE_DB: new_api_logs
#      CLICKHOUSE_USER: default
#      CLICKHOUSE_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
#      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
#    volumes:
#      - clickhouse_data:/var/lib/clickhouse
#    networks:
#      - new-api-network
#    ports:
#      - "8123:8123"  # HTTP interface, uncomment if you need external access
#      - "9000:9000"  # Native interface used by the LOG_SQL_DSN example above

volumes:
  pg_data:
#  mysql_data:
#  clickhouse_data:

networks:
  new-api-network:
    driver: bridge
