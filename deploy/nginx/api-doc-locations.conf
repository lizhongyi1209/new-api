# Public API documentation served directly by Nginx.
# Include this file inside every API-domain server block.

location = /docs {
  return 301 /docs/;
}

location = /docs/ {
  default_type text/html;
  charset utf-8;
  alias /var/www/new-api-docs/api-doc.html;
  etag on;
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options "nosniff" always;
}

location = /docs/api-doc {
  default_type text/html;
  charset utf-8;
  alias /var/www/new-api-docs/api-doc.html;
  etag on;
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options "nosniff" always;
}

location = /docs/download {
  default_type text/html;
  charset utf-8;
  alias /var/www/new-api-docs/api-doc.html;
  add_header Content-Disposition 'attachment; filename="api-doc.html"';
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options "nosniff" always;
}
