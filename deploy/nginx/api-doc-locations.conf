# Public API documentation served directly by Nginx.
# Built from docs/api-site by docs/api-site/build.py and published by scripts/deploy-api-doc.sh.
# Include this file inside every API-domain server block.

location = /docs {
  return 301 /docs/;
}

# Old single-page URL. Browsers keep the #fragment across the redirect, and the
# overview page forwards old section anchors (for example #wan3) to their new pages.
location = /docs/api-doc {
  return 301 /docs/;
}

location = /docs/download {
  types { }
  default_type text/markdown;
  charset utf-8;
  charset_types text/markdown;
  alias /var/www/new-api-docs/public/docs/llms-full.txt;
  add_header Content-Disposition 'attachment; filename="o1key-api-doc.md"';
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /docs/ {
  root /var/www/new-api-docs/public;
  index index.html;
  try_files $uri $uri.html $uri/ =404;
  types {
    text/html html;
    text/markdown md;
    text/plain txt;
    text/css css;
    application/javascript js;
    application/json json;
  }
  charset utf-8;
  charset_types text/markdown text/plain text/css application/javascript application/json;
  etag on;
  add_header Cache-Control "no-cache";
  add_header Access-Control-Allow-Origin "*";
  add_header X-Content-Type-Options "nosniff" always;
}
